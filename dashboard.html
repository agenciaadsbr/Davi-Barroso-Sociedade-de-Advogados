<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leads — Davi Barroso</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0A">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box}
:root{--bg:#0A0A0A;--card:#171717;--line:#262626;--line2:#2E2E2E;--text:#FAFAFA;--muted:#A3A3A3;--dim:#737373;--green:#4ADE80;--gold:#D2B784}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:28px 20px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--text);font-size:12.5px;font-weight:600;letter-spacing:.04em;cursor:pointer;text-decoration:none;transition:background .2s,border-color .2s}
.btn:hover{background:#1F1F1F;border-color:#3A3A3A}
.btn-primary{background:var(--text);color:#0A0A0A;border-color:var(--text)}
.btn-primary:hover{background:#E5E5E5;border-color:#E5E5E5}
.btn:focus-visible,input:focus-visible{outline:2px solid #FAFAFA;outline-offset:2px}
input[type=text],input[type=password],input[type=date]{height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:#0F0F0F;color:var(--text);color-scheme:dark}
input:focus{border-color:#525252;outline:none}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login form{width:100%;max-width:360px;padding:28px;display:flex;flex-direction:column;gap:14px}
#login h1{margin:0 0 4px;font-size:15px;letter-spacing:.08em}
#login label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
#login .btn{height:40px;margin-top:6px}
.err{margin:0;font-size:13px;color:#FCA5A5}

/* app */
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.06em}
header p{margin:6px 0 0;font-size:13px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-size:13.5px;font-weight:600}
.range{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.range span{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--dim)}
.chart-box{position:relative;height:300px;padding:16px 14px 6px}
.legend{display:flex;gap:22px;flex-wrap:wrap;padding:6px 18px 16px;font-size:12.5px;color:var(--muted)}
.legend b{color:var(--text);font-weight:600;margin-left:4px}
.dot{display:inline-block;width:10px;height:2px;border-radius:2px;margin-right:8px;vertical-align:middle}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:16px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:10px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 18px;border-bottom:1px solid #1F1F1F;color:#E5E5E5;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:28px 18px;text-align:center;color:var(--dim)}
.wa{height:30px;padding:0 10px;font-size:12px;letter-spacing:0;font-weight:500;gap:6px}
.wa svg{color:var(--green)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);font-size:11.5px;color:var(--muted)}
.loading{opacity:.5;pointer-events:none}
@media (max-width:640px){
  header{flex-direction:row}
  .card-h{flex-direction:column;align-items:flex-start}
  .chart-box{height:240px}
  /* tabela de leads vira lista no celular */
  #leads-tbl thead{display:none}
  #leads-tbl tr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 16px;border-bottom:1px solid #1F1F1F}
  #leads-tbl td{padding:0;border:0;white-space:normal}
  #leads-tbl td[data-k=nome]{font-weight:600;font-size:14px;color:var(--text)}
  #leads-tbl td[data-k=acao]{grid-row:1 / span 3;grid-column:2;align-self:center}
  #leads-tbl td[data-k=whats],#leads-tbl td[data-k=data]{color:var(--muted);font-size:12.5px}
  #leads-tbl td[data-k=lp],#leads-tbl td[data-k=origem],#leads-tbl td[data-k=x]{font-size:12px;color:var(--dim)}
}
</style>
</head>
<body>

<section id="login" hidden>
<form class="card" id="login-form" autocomplete="on">
<h1>LEADS — DAVI BARROSO</h1>
<p class="muted" style="margin:0 0 6px;font-size:12.5px">Entre para ver os contatos recebidos pela página.</p>
<label>Usuário<input type="text" id="l-user" autocomplete="username" required></label>
<label>Senha<input type="password" id="l-pass" autocomplete="current-password" required></label>
<p class="err" id="l-err" hidden></p>
<button class="btn btn-primary" type="submit" id="l-btn">Entrar</button>
</form>
</section>

<div id="app" hidden>
<div class="wrap">
<header>
<div>
<h1>LEADS — DAVI BARROSO</h1>
<p class="muted" id="subtitle">Carregando…</p>
</div>
<button class="btn" id="logout" type="button">SAIR</button>
</header>

<section class="card">
<div class="card-h">
<h2>Evolução diária</h2>
<div class="range">
<span>DE</span><input type="date" id="d-from" aria-label="Data inicial">
<span>ATÉ</span><input type="date" id="d-to" aria-label="Data final">
</div>
</div>
<div class="chart-box"><canvas id="chart" aria-label="Gráfico de visitas, cadastros e taxa de conversão por dia" role="img"></canvas></div>
<div class="legend">
<span><i class="dot" style="background:#A3A3A3"></i>Visitas<b id="lg-v">0</b></span>
<span><i class="dot" style="background:#4ADE80"></i>Cadastros<b id="lg-l">0</b></span>
<span><i class="dot" style="background:#D2B784"></i>Taxa de conversão<b id="lg-c">0%</b></span>
</div>
</section>

<div class="grid">
<section class="card">
<div class="card-h"><h2>Conversão por LP</h2></div>
<div class="tbl-wrap">
<table>
<thead><tr><th>LP</th><th class="num">Visitas</th><th class="num">Leads</th><th class="num">Conv.</th></tr></thead>
<tbody id="conv-body"></tbody>
</table>
</div>
</section>

<section class="card">
<div class="card-h"><h2>Leads</h2><span class="muted" id="leads-count" style="font-size:12.5px"></span></div>
<div class="tbl-wrap">
<table id="leads-tbl">
<thead><tr><th>Nome</th><th>WhatsApp</th><th>LP</th><th>Origem</th><th>Data</th><th>Ação</th></tr></thead>
<tbody id="leads-body"></tbody>
</table>
</div>
</section>
</div>
</div>
</div>

<script>
(function () {
  var SUPABASE_URL = 'https://qxhnjzyhtllmtdrcyygi.supabase.co';
  var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4aG5qenlodGxsbXRkcmN5eWdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMzczNjgsImV4cCI6MjA5NzgxMzM2OH0.DWf4I_x9F--H7ZZHUt_n4V3B__Nlsf1jNZdUV0vNBLU';
  var LOGIN_EMAIL = 'admin@davi-barroso.adsbr.internal';
  var CLIENTE = 'Davi Barroso Sociedade de Advogados';
  var LP_NOMES = { 'davi-barroso': 'Direito Penal — Grande ABC' };
  var TZ = 'America/Sao_Paulo';

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  var $ = function (id) { return document.getElementById(id); };
  var chart = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function dayKey(d) { return new Date(d).toLocaleDateString('en-CA', { timeZone: TZ }); }
  function fmtDate(d) {
    return new Date(d).toLocaleString('pt-BR', { timeZone: TZ, day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
  }
  function fmtPhone(v) {
    var d = String(v || '').replace(/\D/g, '');
    if (d.length > 11 && d.indexOf('55') === 0) d = d.slice(2);
    if (d.length === 11) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
    if (d.length === 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
    return v || '';
  }
  function waLink(phone, nome) {
    var d = String(phone || '').replace(/\D/g, '');
    if (d.length === 10 || d.length === 11) d = '55' + d;
    var first = String(nome || '').trim().split(/\s+/)[0] || '';
    var msg = 'Olá, ' + first + '. Recebemos seu contato através da ' + CLIENTE + ' e gostaria de dar continuidade ao seu atendimento.';
    return 'https://wa.me/' + d + '?text=' + encodeURIComponent(msg);
  }
  function pct(a, b) { return b ? (a / b * 100) : 0; }
  function fmtPct(n) { return n.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%'; }
  function lpName(site) { return LP_NOMES[site] || site; }

  // ---------- Login ----------
  function showLogin() { $('app').hidden = true; $('login').hidden = false; $('l-user').focus(); }
  function showApp() { $('login').hidden = true; $('app').hidden = false; }

  $('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var u = $('l-user').value.trim();
    var email = u.indexOf('@') > -1 ? u : (u.toLowerCase() === 'admin' ? LOGIN_EMAIL : '');
    $('l-err').hidden = true;
    if (!email) { $('l-err').textContent = 'Usuário ou senha incorretos.'; $('l-err').hidden = false; return; }
    $('l-btn').classList.add('loading');
    var res = await sb.auth.signInWithPassword({ email: email, password: $('l-pass').value });
    $('l-btn').classList.remove('loading');
    if (res.error) { $('l-err').textContent = 'Usuário ou senha incorretos.'; $('l-err').hidden = false; return; }
    $('l-pass').value = '';
    showApp(); load();
  });

  $('logout').addEventListener('click', async function () {
    await sb.auth.signOut();
    showLogin();
  });

  // ---------- Dados ----------
  async function fetchAll(table, cols, fromISO, toISO) {
    var all = [], size = 1000, page = 0;
    while (true) {
      var q = sb.from(table).select(cols).order('created_at', { ascending: false }).range(page * size, page * size + size - 1);
      if (fromISO) q = q.gte('created_at', fromISO);
      if (toISO) q = q.lt('created_at', toISO);
      var r = await q;
      if (r.error) throw r.error;
      all = all.concat(r.data || []);
      if (!r.data || r.data.length < size) break;
      page++;
    }
    return all;
  }

  function initDates() {
    var today = new Date();
    var from = new Date(today.getTime() - 29 * 86400000);
    $('d-to').value = dayKey(today);
    $('d-from').value = dayKey(from);
  }
  $('d-from').addEventListener('change', load);
  $('d-to').addEventListener('change', load);

  async function load() {
    var from = $('d-from').value, to = $('d-to').value;
    if (!from || !to) return;
    if (from > to) { var t = from; from = to; to = t; }
    var fromISO = from + 'T00:00:00-03:00';
    var toDate = new Date(to + 'T00:00:00-03:00'); toDate = new Date(toDate.getTime() + 86400000);
    var toISO = toDate.toISOString();
    document.body.classList.add('loading');
    try {
      var res = await Promise.all([
        fetchAll('lp_visits', 'site,created_at', fromISO, toISO),
        fetchAll('lp_leads', 'id,site,nome,whatsapp,origem,created_at', fromISO, toISO),
        sb.from('lp_leads').select('id', { count: 'exact', head: true })
      ]);
      var visits = res[0], leads = res[1], total = res[2].count || 0;
      $('subtitle').textContent = total + (total === 1 ? ' lead no total' : ' leads no total') + ' · ' + leads.length + ' no período';
      renderChart(visits, leads, from, to);
      renderConv(visits, leads);
      renderLeads(leads);
    } catch (err) {
      if (err && (err.status === 401 || /JWT|auth/i.test(err.message || ''))) { showLogin(); return; }
      $('subtitle').textContent = 'Não foi possível carregar os dados. Atualize a página para tentar de novo.';
    } finally {
      document.body.classList.remove('loading');
    }
  }

  function renderChart(visits, leads, from, to) {
    var days = [], d = new Date(from + 'T12:00:00-03:00'), end = new Date(to + 'T12:00:00-03:00');
    while (d <= end) { days.push(dayKey(d)); d = new Date(d.getTime() + 86400000); }
    var v = {}, l = {};
    days.forEach(function (k) { v[k] = 0; l[k] = 0; });
    visits.forEach(function (r) { var k = dayKey(r.created_at); if (k in v) v[k]++; });
    leads.forEach(function (r) { var k = dayKey(r.created_at); if (k in l) l[k]++; });
    var vs = days.map(function (k) { return v[k]; });
    var ls = days.map(function (k) { return l[k]; });
    var cs = days.map(function (k, i) { return +pct(ls[i], vs[i]).toFixed(1); });
    var labels = days.map(function (k) { var p = k.split('-'); return p[2] + '/' + p[1]; });

    $('lg-v').textContent = visits.length;
    $('lg-l').textContent = leads.length;
    $('lg-c').textContent = fmtPct(pct(leads.length, visits.length));

    var data = {
      labels: labels,
      datasets: [
        { label: 'Visitas', data: vs, borderColor: '#A3A3A3', backgroundColor: '#A3A3A3', yAxisID: 'y', tension: .3, pointRadius: 0, pointHoverRadius: 4, borderWidth: 1.6 },
        { label: 'Cadastros', data: ls, borderColor: '#4ADE80', backgroundColor: '#4ADE80', yAxisID: 'y', tension: .3, pointRadius: 0, pointHoverRadius: 4, borderWidth: 1.8 },
        { label: 'Conversão (%)', data: cs, borderColor: '#D2B784', backgroundColor: '#D2B784', yAxisID: 'y1', tension: .3, pointRadius: 0, pointHoverRadius: 4, borderWidth: 1.4, borderDash: [4, 4] }
      ]
    };
    if (chart) { chart.data = data; chart.update(); return; }
    chart = new Chart($('chart'), {
      type: 'line',
      data: data,
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#0A0A0A', borderColor: '#2E2E2E', borderWidth: 1, titleColor: '#FAFAFA', bodyColor: '#D4D4D4', padding: 10,
            callbacks: { label: function (c) { return ' ' + c.dataset.label + ': ' + (c.dataset.yAxisID === 'y1' ? c.parsed.y.toLocaleString('pt-BR') + '%' : c.parsed.y); } }
          }
        },
        scales: {
          x: { grid: { color: '#1F1F1F' }, ticks: { color: '#737373', maxRotation: 0, autoSkipPadding: 14 } },
          y: { beginAtZero: true, grid: { color: '#1F1F1F' }, ticks: { color: '#737373', precision: 0 } },
          y1: { beginAtZero: true, position: 'right', grid: { display: false }, ticks: { color: '#737373', callback: function (v) { return v + '%'; } } }
        }
      }
    });
  }

  function renderConv(visits, leads) {
    var map = {};
    visits.forEach(function (r) { (map[r.site] = map[r.site] || { v: 0, l: 0 }).v++; });
    leads.forEach(function (r) { (map[r.site] = map[r.site] || { v: 0, l: 0 }).l++; });
    var sites = Object.keys(map).sort(function (a, b) { return map[b].v - map[a].v; });
    if (!sites.length) { $('conv-body').innerHTML = '<tr><td colspan="4" class="empty">Nenhum dado encontrado</td></tr>'; return; }
    $('conv-body').innerHTML = sites.map(function (s) {
      var m = map[s];
      return '<tr><td>' + esc(lpName(s)) + '</td><td class="num">' + m.v + '</td><td class="num">' + m.l + '</td><td class="num">' + fmtPct(pct(m.l, m.v)) + '</td></tr>';
    }).join('');
  }

  function renderLeads(leads) {
    $('leads-count').textContent = leads.length ? leads.length + (leads.length === 1 ? ' contato' : ' contatos') : '';
    if (!leads.length) { $('leads-body').innerHTML = '<tr><td colspan="6" class="empty">Nenhum lead encontrado</td></tr>'; return; }
    var icon = '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M3.6 20.4l1.3-4.1A8.6 8.6 0 1 1 8.1 19.3z"></path></svg>';
    $('leads-body').innerHTML = leads.map(function (r) {
      return '<tr>' +
        '<td data-k="nome">' + esc(r.nome) + '</td>' +
        '<td data-k="whats">' + esc(fmtPhone(r.whatsapp)) + '</td>' +
        '<td data-k="lp">' + esc(lpName(r.site)) + '</td>' +
        '<td data-k="origem">' + esc(r.origem || '—') + '</td>' +
        '<td data-k="data">' + esc(fmtDate(r.created_at)) + '</td>' +
        '<td data-k="acao"><a class="btn wa" target="_blank" rel="noopener" href="' + esc(waLink(r.whatsapp, r.nome)) + '" aria-label="Chamar ' + esc(r.nome) + ' no WhatsApp">' + icon + 'WhatsApp</a></td>' +
        '</tr>';
    }).join('');
  }

  // ---------- Início ----------
  initDates();
  sb.auth.getSession().then(function (r) {
    if (r.data && r.data.session) { showApp(); load(); } else { showLogin(); }
  });
  sb.auth.onAuthStateChange(function (ev) { if (ev === 'SIGNED_OUT') showLogin(); });
})();
</script>
</body>
</html>
